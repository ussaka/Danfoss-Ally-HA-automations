blueprint:
  name: Danfoss Ally set weekly schedule
  description: >
    ## Danfoss Ally set weekly schedule

    **Version: 2.0.1**

    [Need help?](https://github.com/ussaka/Danfoss-Ally-HA-integration?tab=readme-ov-file#get-weekly-schedule-script)
  domain: automation
  input:
    ally_trv:
      name: Danfoss Ally eTRV
      selector:
        device:
          entity:
            domain: climate
      required: true
    schedule_days:
      name: Weekdays
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: Monday
              value: monday
            - label: Tuesday
              value: tuesday
            - label: Wednesday
              value: wednesday
            - label: Thursday
              value: thursday
            - label: Friday
              value: friday
            - label: Saturday
              value: saturday
            - label: Sunday
              value: sunday

    transition1_setpoint:
      name: Transition 1 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition1_time:
      name: Transition 1 time
      selector:
        time: {}

    transition2_setpoint:
      name: Transition 2 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition2_time:
      name: Transition 2 time
      selector:
        time: {}

    transition3_setpoint:
      name: Transition 3 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition3_time:
      name: Transition 3 time
      selector:
        time: {}

    transition4_setpoint:
      name: Transition 4 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition4_time:
      name: Transition 4 time
      selector:
        time: {}

    transition5_setpoint:
      name: Transition 5 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition5_time:
      name: Transition 5 time
      selector:
        time: {}

    transition6_setpoint:
      name: Transition 6 temperature (°C)
      selector:
        number:
          min: 0
          max: 30
          mode: box
          unit_of_measurement: °C
    transition6_time:
      name: Transition 6 time
      selector:
        time: {}

variables:
  device_name: "{{ device_attr(inputs.ally_trv, 'name') }}"
  day_list: "{{ inputs.schedule_days }}"
  transition_count: "{{ inputs.transition_count | int }}"

trigger: []

action:
  - variables:
      transition_entities: >
        [
          {"temp": inputs.transition1_setpoint, "time": inputs.transition1_time},
          {"temp": inputs.transition2_setpoint, "time": inputs.transition2_time},
          {"temp": inputs.transition3_setpoint, "time": inputs.transition3_time},
          {"temp": inputs.transition4_setpoint, "time": inputs.transition4_time},
          {"temp": inputs.transition5_setpoint, "time": inputs.transition5_time},
          {"temp": inputs.transition6_setpoint, "time": inputs.transition6_time}
        ]
  - variables:
      transitions: >
        {% set output = [] %}
        {% for t in transition_entities[:transition_count] %}
          {% if t.temp is not none and t.time is not none %}
            {% set parts = t.time.split(':') %}
            {% set hour = parts[0] | int %}
            {% set minute = parts[1] | int %}
            {% set trans = {"heating_setpoint": t.temp, "time": hour * 60 + minute} %}
            {% set output = output + [trans] %}
          {% endif %}
        {% endfor %}
        {{ output | to_json }}
  - service: mqtt.publish
    data:
      topic: "zigbee2mqtt/{{ device_name }}/set"
      payload: |
        {
          "weekly_schedule": {
            "days": {{ day_list | to_json }},
            "transitions": {{ transitions }}
          }
        }
  - wait_for_trigger:
      - platform: mqtt
        topic: "zigbee2mqtt/{{ device_name }}"
        value_template: >
          {% set ws = value_json.weekly_schedule %}
          {% if ws is not defined %}
            false
          {% else %}
            {% set days_match = ws.days | sort == day_list | sort %}
            {% set sent_trans = transitions | from_json %}
            {% set received_trans = ws.transitions %}
            {% set trans_match = sent_trans == received_trans %}
            {{ days_match and trans_match }}
          {% endif %}
    timeout: "00:00:30"
    continue_on_timeout: false
  - service: persistent_notification.create
    data:
      title: "Danfoss Ally Weekly Schedule"
      message: "✅ Schedule set to {{ device_name }}."
